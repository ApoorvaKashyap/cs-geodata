name: Bug Report
description: File a bug report.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: Please describe issue you faced.
      description: Also tell us, what did you expect to happen?
      placeholder: Describe the issue in detail
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What is the version of library you are using?
      placeholder: 0.0.1
    validations:
      required: true
  - type: dropdown
    id: python
    attributes:
      label: What is the python version you are using?
      multiple: true
      options:
        - Python 3.11
        - Python 3.12
        - Python 3.13
        - Python 3.14
  - type: dropdown
    id: package-manager
    attributes:
      label: Which package manager are you using?
      description: If you are unsure select pip.
      options:
        - uv
        - poetry
        - conda
        - pip
        - pixi
        - pipenv
  - type: input
    id: OS
    attributes:
      label: Which OS are you using?
      description: OS Name and version
      placeholder: Ubuntu 22.04
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false
      accept: ".png,.jpg,.gif,.log,.txt,.zip"
